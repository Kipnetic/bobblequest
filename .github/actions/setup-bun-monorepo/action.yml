name: Setup Bun Monorepo
description: >
  Install Bun, restore Bun install cache, and optionally restore the Turbo task
  cache. Restore only: the consuming job saves. Consolidates the common setup
  steps used across every CI job into a single composite action so the YAML
  workflow stays anchor-free (GitHub Actions does not support YAML anchors).
  NOTE: actions/checkout must be run by each consuming job BEFORE this
  composite, since local composite actions cannot be loaded until the repo is
  checked out.

inputs:
  turbo-cache:
    description: 'Restore the .turbo task cache in addition to the Bun install cache.'
    required: false
    default: 'false'
  turbo-cache-scope:
    description: >
      Namespace for the Turbo cache key. Each CI job runs different tasks, so
      each keeps its own .turbo cache instead of overwriting one shared entry.
    required: false
    default: 'shared'

# Restore only. A composite action has no post step of its own, so saving is
# the consuming job's job (see the "Save ... cache" steps at the end of
# ci.yml), and it saves only from main. A PR-saved cache is scoped to
# refs/pull/N/merge, which no other PR can read, and tarring the Bun cache in
# the post step cost every PR run minutes (apex-hub PR 334: 490s).
outputs:
  bun-cache-key:
    description: 'Exact key the Bun install cache is saved under.'
    value: ${{ steps.bun-cache.outputs.cache-primary-key }}
  bun-cache-hit:
    description: "'true' when the Bun install cache matched the exact key."
    value: ${{ steps.bun-cache.outputs.cache-hit }}
  turbo-cache-key:
    description: 'Exact key the Turbo task cache is saved under.'
    value: ${{ steps.turbo-cache.outputs.cache-primary-key }}
  turbo-cache-hit:
    description: "'true' when the Turbo task cache matched the exact key."
    value: ${{ steps.turbo-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    # The self-hosted runner's containers are reused between jobs, so the Bun
    # cache from the last job is usually still on disk. Downloading the saved
    # copy over it cost apex-hub 2-8 minutes per job. When a local cache
    # exists, only look the saved key up (so a main run still knows whether to
    # save) and let bun fetch whatever is missing. A fresh VM
    # (CI_RUNNER=ubuntu-latest) has no local cache and restores as before.
    - name: Check for a local Bun cache
      id: local-bun
      shell: bash
      run: |
        CACHE_DIR="$HOME/.bun/install/cache"
        # A missing directory is a fresh runner, not an error: under the
        # step shell's pipefail, a failing ls would end the whole setup.
        if [ -d "$CACHE_DIR" ]; then
          ENTRIES=$(ls -A "$CACHE_DIR" | wc -l)
        else
          ENTRIES=0
        fi
        echo "local Bun cache: $ENTRIES entries in $CACHE_DIR"
        if [ "$ENTRIES" -gt 0 ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore Bun install cache
      id: bun-cache
      uses: actions/cache/restore@v4
      with:
        lookup-only: ${{ steps.local-bun.outputs.present == 'true' }}
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml', 'turbo.json') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Restore Turbo task cache
      id: turbo-cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: turbo-${{ inputs.turbo-cache-scope }}-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml', 'turbo.json') }}
        restore-keys: turbo-${{ inputs.turbo-cache-scope }}-${{ runner.os }}-
